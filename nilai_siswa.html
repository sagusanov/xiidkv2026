    let activeTab = 'dkv1';
    const KKM = 75;

    function renderTable(classKey) {
      const list = dataNilai[classKey] || [];
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      let totalAverageSum = 0;
      let maxScore = 0;
      let tuntasCount = 0;

      list.forEach((s) => {
        const scores = [s.brief, s.komposisi, s.dng, s.wallpaper, s.mockup];
        const validScores = scores.filter(v => v > 0);
        const avg = validScores.length > 0 ? (validScores.reduce((a, b) => a + b, 0) / validScores.length) : 0;
        const roundedAvg = Math.round(avg * 10) / 10;

        totalAverageSum += roundedAvg;
        if (roundedAvg > maxScore) maxScore = roundedAvg;
        if (roundedAvg >= KKM) tuntasCount++;

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors";
        tr.innerHTML = `
          <td class="py-3 px-4 text-center font-medium text-slate-500">${s.no}</td>
          <td class="py-3 px-4 font-semibold">${s.nama}</td>
          <td class="py-3 px-4 text-center"><span class="px-2 py-0.5 rounded text-xs font-semibold ${s.lp === 'L' ? 'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300' : 'bg-pink-100 text-pink-700 dark:bg-pink-900/40 dark:text-pink-300'}">${s.lp}</span></td>
          <td class="py-3 px-4 text-center font-mono text-xs text-slate-500 dark:text-slate-400">${s.nipd}</td>
          <td class="py-3 px-3 text-center ${s.brief < KKM ? 'text-rose-500 font-bold' : ''}">${s.brief}</td>
          <td class="py-3 px-3 text-center ${s.komposisi < KKM ? 'text-rose-500 font-bold' : ''}">${s.komposisi}</td>
          <td class="py-3 px-3 text-center ${s.dng < KKM ? 'text-rose-500 font-bold' : ''}">${s.dng}</td>
          <td class="py-3 px-3 text-center ${s.wallpaper < KKM ? 'text-rose-500 font-bold' : ''}">${s.wallpaper}</td>
          <td class="py-3 px-3 text-center ${s.mockup < KKM ? 'text-rose-500 font-bold' : ''}">${s.mockup}</td>
          <td class="py-3 px-4 text-center font-bold text-brand-600 dark:text-brand-400">${roundedAvg}</td>
          <td class="py-3 px-4 text-center">
            ${roundedAvg >= KKM 
              ? '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300">Tuntas</span>'
              : '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-rose-100 text-rose-800 dark:bg-rose-900/40 dark:text-rose-300">Belum</span>'
            }
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Update Statistics
      const totalSiswa = list.length;
      const classAvg = totalSiswa > 0 ? (totalAverageSum / totalSiswa).toFixed(1) : 0;
      const tuntasPercent = totalSiswa > 0 ? Math.round((tuntasCount / totalSiswa) * 100) : 0;

      document.getElementById('statTotalSiswa').textContent = totalSiswa;
      document.getElementById('statRataRata').textContent = classAvg;
      document.getElementById('statMax').textContent = maxScore;
      document.getElementById('statTuntas').textContent = `${tuntasPercent}%`;
    }

    function switchTab(classKey) {
      activeTab = classKey;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = "tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200";
      });

      const activeBtn = document.getElementById(`tab-${classKey}`);
      if (activeBtn) {
        activeBtn.className = "tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition-all bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400 shadow-sm";
      }

      document.getElementById('searchInput').value = '';
      renderTable(classKey);
    }

    function filterTable() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const rows = document.querySelectorAll('#tableBody tr');

      rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        row.style.display = text.includes(query) ? '' : 'none';
      });
    }

    // Dark Mode Toggle
    const themeToggleBtn = document.getElementById('themeToggle');
    themeToggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    // Initial Render
    renderTable('dkv1');
  </script>
